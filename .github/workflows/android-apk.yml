name: Android APK — Suffah High School

on:
  push:
    branches: [main, feature/cloudflare-r2-student-files, feature/canteen-stationery-inventory, fix/inventory-stock-add-product]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and test Android APK
    env:
      HAS_SIGNING_SECRET: ${{ secrets.SUFFAH_DEBUG_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout school app
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Fetch Dart packages
        run: flutter pub get

      # GitHub stores only committed files. Until the image is committed,
      # keep the existing icon and allow the test APK to build normally.
      - name: Generate app launcher icons when provided
        shell: bash
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "::warning::Custom icon not found at assets/icon/app_icon.png. Existing launcher icon retained."
          fi

      - name: Format Dart sources in CI
        run: dart format lib test

      - name: Analyze Flutter source (warnings and errors are fatal)
        # Keep informational lint diagnostics visible without blocking APK builds.
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter widget tests
        run: flutter test

      # GitHub runners have different temporary debug keys by default.
      # A stable key enables Android to accept APK upgrades in place.
      - name: Restore preview signing identity
        id: debug_signing_cache
        if: env.HAS_SIGNING_SECRET != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: suffah-preview-debug-signing-key-v1

      - name: Prepare a consistent Android debug signature
        env:
          KEYSTORE_BASE64: ${{ secrets.SUFFAH_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using the permanent GitHub Actions debug signing secret."
          elif [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Suffah School Preview, OU=Android Testing, O=Suffah High School, C=PK"
            echo "::warning::A new preview key was generated; an existing APK signed with another key must be uninstalled once. Configure the signing secret to protect against cache expiry."
          else
            echo "Restored the previous preview signing identity."
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify Cloudflare R2 Worker is configured
        env:
          R2_WORKER_URL: ${{ vars.R2_WORKER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${R2_WORKER_URL}" || "${R2_WORKER_URL}" != https://* ]]; then
            echo "::error::Set Actions repository variable R2_WORKER_URL to your HTTPS Worker URL."
            exit 1
          fi
          echo "Checking Cloudflare Worker health without exposing secrets..."
          response="$(curl --fail --silent --show-error --max-time 20 "${R2_WORKER_URL%/}/health")"
          if [[ "${response}" != *'"status":"ok"'* ]]; then
            echo "::error::Cloudflare Worker health endpoint did not respond with status ok."
            exit 1
          fi
          echo "Cloudflare Worker health check passed."

      - name: Build Android APK (development / debug signed)
        env:
          R2_WORKER_URL: ${{ vars.R2_WORKER_URL }}
        run: flutter build apk --debug --dart-define="R2_WORKER_URL=${R2_WORKER_URL}" --build-number "${{ github.run_number }}"

      - name: Preserve preview signature for future updates
        if: env.HAS_SIGNING_SECRET != 'true' && steps.debug_signing_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: suffah-preview-debug-signing-key-v1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Suffah-High-School-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
