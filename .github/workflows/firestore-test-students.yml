name: Firestore Test Student Generator
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase project ID (prefer a test project)'
        required: true
        type: string
      count:
        description: 'Total desired synthetic students (1–100)'
        default: 100
        type: number
      mode:
        description: 'Dry run or apply'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: 'For apply, retype the exact Firebase project ID'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: firestore-test-student-generator
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate seed plan
        run: python -m unittest discover -s scripts -p 'test_seed_test_students.py'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SEED_SERVICE_ACCOUNT }}
      - name: Install Firebase Admin
        run: python -m pip install 'firebase-admin>=6.6,<8'
      - name: Run seed
        env:
          TARGET: ${{ inputs.project }}
          COUNT: ${{ inputs.count }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [[ "$MODE" == "apply" ]]; then
            python scripts/seed_test_students.py --project "$TARGET" --count "$COUNT" --apply --confirm "$CONFIRM"
          else
            python scripts/seed_test_students.py --project "$TARGET" --count "$COUNT"
          fi
