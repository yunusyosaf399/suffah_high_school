name: Windows desktop build
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # VS 2026 rejects deprecated coroutine headers in audioplayers_windows.
    # Keep this build on VS 2022 until upstream native plugins migrate.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Build Windows release
        shell: pwsh
        env:
          R2_WORKER_URL: ${{ vars.R2_WORKER_URL }}
        run: flutter build windows --release --dart-define="R2_WORKER_URL=$env:R2_WORKER_URL"
      - name: Verify executable and required runtime
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$dir/suffah_high_school.exe")) { throw 'Windows executable missing' }
          if (!(Test-Path "$dir/flutter_windows.dll")) { throw 'Flutter runtime missing' }
          if (!(Test-Path "$dir/data")) { throw 'Flutter data directory missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: suffah-school-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
